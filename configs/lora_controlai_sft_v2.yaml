# ControlAI SFT v2: Step-by-Step Chain-of-Thought (CoT), Textbook Case Studies & Base STEM Replay
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
data: data/training/sft_v2
seed: 20260817

# Only assistant response tokens (CoT derivations and verified solutions) contribute to gradient loss
mask_prompt: true

# Qwen3-4B has 36 transformer blocks
num_layers: 36
batch_size: 1
grad_accumulation_steps: 4
iters: 4000
max_seq_length: 2048
grad_checkpoint: false
clear_cache_threshold: 12000000000

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
learning_rate: 4.0e-6
lr_schedule:
  name: cosine_decay
  # 4000 iters / accumulation 4 = 1000 optimizer steps
  arguments: [4.0e-6, 950, 4.0e-7]
  warmup: 50
  warmup_init: 4.0e-7

val_batches: -1
steps_per_report: 25
steps_per_eval: 500
save_every: 500
adapter_path: adapters/controlai_qwen3_4b_sft_v2

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 32.0
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
