# First end-to-end ControlAI QLoRA pilot on Apple Silicon.
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
data: data/sft_v0
seed: 20260816

# Learn only the assistant answer, not the system/user prompt.
mask_prompt: true

# Conservative settings for a 24 GB Apple Silicon machine.
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 600
learning_rate: 1.0e-5
max_seq_length: 1024
grad_checkpoint: false

val_batches: -1
steps_per_report: 10
steps_per_eval: 100
save_every: 100
adapter_path: adapters/controlai_qwen3_4b_v0

lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
