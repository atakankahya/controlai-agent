# Recommended first serious run: verified behavior/code SFT, no DAPT dependency.
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
data: data/training/sft_v1
seed: 20260816

# Only assistant tokens contribute to loss.
mask_prompt: true

# Qwen3-4B has 36 transformer blocks. Rank 16 across all blocks is still a
# compact adapter, but has materially more capacity than the failed v0 pilot.
num_layers: 36
batch_size: 1
grad_accumulation_steps: 4
iters: 7000
max_seq_length: 1024
grad_checkpoint: false
clear_cache_threshold: 12000000000

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
learning_rate: 8.0e-6
lr_schedule:
  name: cosine_decay
  # Scheduler steps advance on optimizer updates: 7000 / accumulation 4 = 1750.
  arguments: [8.0e-6, 1700, 8.0e-7]
  warmup: 50
  warmup_init: 8.0e-7

val_batches: -1
steps_per_report: 25
steps_per_eval: 500
save_every: 500
adapter_path: adapters/controlai_qwen3_4b_sft_v1

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 32.0
  # Pin every attention and MLP projection explicitly. This avoids silently
  # changing adapter capacity if a future mlx-lm release changes its defaults.
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
