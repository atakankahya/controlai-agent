# ControlAI Agent SFT: Native multi-turn tool calling, grounding & specification gating
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
data: data/training/agent_sft_v1
seed: 20260817

# Only assistant responses (<tool_call> and grounded synthesis) contribute to gradient loss
mask_prompt: true

num_layers: 36
batch_size: 1
grad_accumulation_steps: 4
iters: 1500
max_seq_length: 2048
grad_checkpoint: false
clear_cache_threshold: 12000000000

optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
learning_rate: 4.0e-6
lr_schedule:
  name: cosine_decay
  # 1500 iters / accumulation 4 = 375 updates
  arguments: [4.0e-6, 350, 4.0e-7]
  warmup: 25
  warmup_init: 4.0e-7

val_batches: -1
steps_per_report: 25
steps_per_eval: 250
save_every: 250
adapter_path: adapters/controlai_qwen3_4b_agent_sft

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 32.0
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
